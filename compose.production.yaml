name: pikado

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    env_file:
      - .env.production
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - 127.0.0.1:3306:3306
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  app:
    image: pikado-app:latest
    build:
      context: .
      target: app
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Pikado}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - uploads:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  web:
    image: pikado-web:latest
    build:
      context: .
      target: web
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Pikado}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
    restart: unless-stopped
    volumes:
      - uploads:/var/www/html/storage/app:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  queue:
    image: pikado-app:latest
    restart: unless-stopped
    command:
      - php
      - artisan
      - queue:work
      - --sleep=2
      - --tries=3
      - --timeout=60
      - --no-interaction
    env_file:
      - .env.production
    volumes:
      - uploads:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    networks:
      - internal

  reverb:
    image: pikado-app:latest
    restart: unless-stopped
    command:
      - php
      - artisan
      - reverb:start
      - --host=0.0.0.0
      - --port=8080
      - --no-interaction
    env_file:
      - .env.production
    volumes:
      - uploads:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/coming-soon:/srv/coming-soon:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      reverb:
        condition: service_started
    networks:
      - internal

volumes:
  database:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
