<!doctype html>
<html lang="sr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        <meta
            name="description"
            content="Nosati Pub — novo mesto za pikado, beer pong i dobru ekipu."
        />
        <link
            rel="icon"
            href="/nosati-pub-favicon.png?v=20260826"
            type="image/png"
            sizes="512x512"
        />
        <title>Nosati Pub — uskoro</title>
        <style>
            :root {
                color-scheme: dark;
                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
                background: #090909;
                color: #f7f2e8;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-width: 320px;
                min-height: 100vh;
                margin: 0;
                overflow: hidden;
                background:
                    radial-gradient(
                        circle at 14% 8%,
                        rgba(234, 88, 12, 0.2),
                        transparent 34rem
                    ),
                    radial-gradient(
                        circle at 88% 92%,
                        rgba(180, 83, 9, 0.14),
                        transparent 30rem
                    ),
                    #090909;
            }

            main {
                position: relative;
                display: grid;
                min-height: 100vh;
                place-items: center;
                padding: 2rem;
                overflow: hidden;
                isolation: isolate;
            }

            .grain {
                position: fixed;
                z-index: -1;
                inset: 0;
                opacity: 0.13;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
                pointer-events: none;
            }

            .dartboard {
                position: absolute;
                z-index: -1;
                top: 50%;
                left: calc(50% + min(34vw, 29rem));
                width: min(70vw, 48rem);
                aspect-ratio: 1;
                border: 1px solid rgba(255, 255, 255, 0.07);
                border-radius: 50%;
                background:
                    radial-gradient(
                        circle,
                        #f97316 0 2.2%,
                        #111 2.3% 5.4%,
                        #f7f2e8 5.5% 10%,
                        #161616 10.1% 24%,
                        #c2410c 24.1% 27%,
                        #111 27.1% 42%,
                        #e7dfd0 42.1% 45%,
                        #101010 45.1% 58%,
                        transparent 58.1%
                    ),
                    repeating-conic-gradient(
                        from -9deg,
                        rgba(255, 255, 255, 0.08) 0 9deg,
                        transparent 9deg 18deg
                    );
                opacity: 0.8;
                transform: translate(-50%, -50%);
                filter: drop-shadow(0 2rem 5rem rgba(0, 0, 0, 0.65));
            }

            .content {
                width: min(100%, 72rem);
            }

            .eyebrow {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                margin: 0 0 1.5rem;
                color: #fb923c;
                font-size: 0.72rem;
                font-weight: 800;
                letter-spacing: 0.22em;
                text-transform: uppercase;
            }

            .eyebrow::before {
                width: 2.5rem;
                height: 1px;
                background: currentColor;
                content: '';
            }

            h1 {
                max-width: 10ch;
                margin: 0;
                font-size: clamp(4rem, 12vw, 9.5rem);
                font-weight: 900;
                letter-spacing: -0.075em;
                line-height: 0.79;
                text-wrap: balance;
            }

            h1 span {
                display: block;
                color: transparent;
                -webkit-text-stroke: 1px rgba(247, 242, 232, 0.42);
            }

            .copy {
                max-width: 35rem;
                margin: 2.25rem 0 0;
                color: #aaa39a;
                font-size: clamp(1rem, 2vw, 1.2rem);
                line-height: 1.7;
            }

            .footer {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 1rem 2rem;
                margin-top: 2.5rem;
            }

            a {
                display: inline-flex;
                align-items: center;
                gap: 0.65rem;
                border: 1px solid rgba(249, 115, 22, 0.36);
                border-radius: 999px;
                padding: 0.8rem 1.15rem;
                color: #fed7aa;
                font-size: 0.83rem;
                font-weight: 750;
                letter-spacing: 0.08em;
                text-decoration: none;
                text-transform: uppercase;
                transition:
                    border-color 180ms ease,
                    background 180ms ease,
                    transform 180ms ease;
            }

            a:hover {
                border-color: #f97316;
                background: rgba(249, 115, 22, 0.1);
                transform: translateY(-2px);
            }

            .address {
                color: #6f6a63;
                font-size: 0.82rem;
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }

            @media (max-width: 700px) {
                main {
                    align-items: end;
                    padding: 2rem 1.4rem 3.5rem;
                }

                .dartboard {
                    top: 14%;
                    left: 70%;
                    width: 31rem;
                    opacity: 0.54;
                }

                h1 {
                    font-size: clamp(4rem, 24vw, 7rem);
                }
            }
        </style>
    </head>
    <body>
        <main>
            <div class="grain" aria-hidden="true"></div>
            <div class="dartboard" aria-hidden="true"></div>
            <section class="content">
                <p class="eyebrow">Stižemo uskoro</p>
                <h1>Nosati <span>Pub.</span></h1>
                <p class="copy">
                    Spremamo mesto za pikado, beer pong, turnire i priče koje se
                    produže do poslednje ture. Vidimo se uskoro.
                </p>
                <div class="footer">
                    <a
                        href="https://www.instagram.com/nosatipub/"
                        rel="noreferrer"
                    >
                        Prati nas na Instagramu ↗
                    </a>
                    <span class="address">Nušićeva 8</span>
                </div>
            </section>
        </main>
    </body>
</html>
