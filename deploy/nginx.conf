map $http_x_forwarded_for $pikado_forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

map $http_x_forwarded_host $pikado_forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

map $http_x_forwarded_proto $pikado_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_FOR $pikado_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $pikado_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $pikado_forwarded_proto;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
